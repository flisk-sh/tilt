# Runs the unofficial codeql-starlark analyzer on this fork's Tiltfiles and *.star files.
name: 🔬 Starlark

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  starlark:
    name: 🔬 Analyze (starlark)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: flisk-sh/codeql-starlark@931ecf10a989eea4246c175b8efb3a5a9fb765e4 # main
